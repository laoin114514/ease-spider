#==================Luogu2Api SDK 配置==================
# 洛谷提交记录统一由 Luogu2Api 服务获取（pkg/luogu2api SDK），账号池与登录态由该服务维护，
# 本程序不再保存洛谷账号密码与 cookie
luogu2api:
  # spider 跑在容器里，Luogu2Api 部署在宿主机时用 host.docker.internal 访问。
  # 其 docker compose 把容器 8080 映射到宿主机 8081（8080 已被其他项目占用）；
  # 若 Luogu2Api 是宿主机上直跑（go run ./cmd/api），改成 http://host.docker.internal:8080
  baseUrl: http://host.docker.internal:8081
  # 访问令牌，需与 Luogu2Api 服务端 configs/.env 里的 ADMIN_TOKEN 一致；留空会在启动时校验失败
  adminToken: ""
