<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>洛谷用户资料页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Microsoft YaHei', sans-serif;
            background: #1e3a8a;
            min-height: 100vh;
            padding: 0;
            color: white;
        }

        .page-container {
            width: 100%;
            min-height: 100vh;
            background: #1e3a8a;
            position: relative;
        }

        .logo {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #9ca3af;
            font-size: 24px;
            font-weight: bold;
            z-index: 10;
        }

        .main-content {
            padding: 40px 20px 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .header-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 15px;
            background: linear-gradient(135deg, #ff6b9d, #c44569);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
            border: 3px solid rgba(255, 255, 255, 0.2);
        }

        .username {
            font-size: 28px;
            font-weight: bold;
            color: #10b981;
            margin-bottom: 5px;
        }

        .uid {
            color: #9ca3af;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .button-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 25px;
        }

        .info-button {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            border-radius: 20px;
            padding: 8px 16px;
            color: white;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
            backdrop-filter: blur(10px);
        }

        .info-button .icon {
            font-size: 14px;
        }

        .main-card {
            background: rgba(59, 130, 246, 0.2);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }

        .stat-icon {
            font-size: 20px;
            margin-bottom: 8px;
            display: block;
        }

        .stat-label {
            color: #d1d5db;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .stat-value {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .social-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .award-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            margin-bottom: 20px;
        }

        .award-icon {
            font-size: 20px;
            margin-bottom: 8px;
            display: block;
        }

        .award-label {
            color: #d1d5db;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .award-value {
            color: white;
            font-size: 14px;
        }

        .progress-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
        }

        .progress-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        .progress-icon {
            font-size: 16px;
        }

        .progress-title {
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        .progress-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            gap: 10px;
        }

        .progress-label {
            min-width: 100px;
            color: #d1d5db;
            font-size: 12px;
        }

        .progress-bar {
            flex: 1;
            height: 16px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            border-radius: 8px;
        }

        .progress-count {
            min-width: 25px;
            color: white;
            font-size: 12px;
            text-align: right;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            color: #9ca3af;
            font-size: 10px;
            padding: 0 20px;
        }

        /* 进度条颜色 - 精确匹配图片 */
        .red { background: #ef4444; }
        .orange { background: #f97316; }
        .yellow { background: #eab308; }
        .green { background: #22c55e; }
        .grey { background: #6b7280; }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="logo">洛谷</div>
        
        <div class="main-content">
            <div class="header-section">
                <div class="avatar">👤</div>
                <div class="username">ZX_Tabris</div>
                <div class="uid">UID: 1510521</div>
                
                <div class="button-row">
                    <button class="info-button">
                        <span class="icon">📊</span>
                        Ranking: None
                    </button>
                    <button class="info-button">
                        <span class="icon">⭐</span>
                        ELO: --
                    </button>
                </div>
            </div>

            <div class="main-card">
                <div class="stats-row">
                    <div class="stat-item">
                        <span class="stat-icon">✅</span>
                        <div class="stat-label">做题数</div>
                        <div class="stat-value">204</div>
                    </div>
                    <div class="stat-item">
                        <span class="stat-icon">📚</span>
                        <div class="stat-label">提交题目数</div>
                        <div class="stat-value">33</div>
                    </div>
                </div>

                <div class="social-row">
                    <div class="stat-item">
                        <span class="stat-icon">👥</span>
                        <div class="stat-label">关注/粉丝</div>
                        <div class="stat-value">2/2</div>
                    </div>
                    <div class="stat-item">
                        <span class="stat-icon">✉️</span>
                        <div class="stat-label">邮箱</div>
                        <div class="stat-value">--</div>
                    </div>
                </div>

                <div class="award-section">
                    <span class="award-icon">🏆</span>
                    <div class="award-label">获奖信息</div>
                    <div class="award-value">暂无记录</div>
                </div>

                <div class="progress-section">
                    <div class="progress-header">
                        <span class="progress-icon">📊</span>
                        <div class="progress-title">提交情况</div>
                    </div>
                    
                    <div class="progress-item">
                        <div class="progress-label">入门</div>
                        <div class="progress-bar">
                            <div class="progress-fill red" style="width: 35%"></div>
                        </div>
                        <div class="progress-count">35</div>
                    </div>
                    
                    <div class="progress-item">
                        <div class="progress-label">普及-</div>
                        <div class="progress-bar">
                            <div class="progress-fill orange" style="width: 60%"></div>
                        </div>
                        <div class="progress-count">106</div>
                    </div>
                    
                    <div class="progress-item">
                        <div class="progress-label">普及/提高-</div>
                        <div class="progress-bar">
                            <div class="progress-fill yellow" style="width: 30%"></div>
                        </div>
                        <div class="progress-count">49</div>
                    </div>
                    
                    <div class="progress-item">
                        <div class="progress-label">普及+/提高</div>
                        <div class="progress-bar">
                            <div class="progress-fill green" style="width: 10%"></div>
                        </div>
                        <div class="progress-count">14</div>
                    </div>
                    
                    <div class="progress-item">
                        <div class="progress-label">提高+/省选</div>
                        <div class="progress-bar">
                            <div class="progress-fill grey" style="width: 0%"></div>
                        </div>
                        <div class="progress-count">0</div>
                    </div>
                    
                    <div class="progress-item">
                        <div class="progress-label">省选/NOI-</div>
                        <div class="progress-bar">
                            <div class="progress-fill grey" style="width: 0%"></div>
                        </div>
                        <div class="progress-count">0</div>
                    </div>
                    
                    <div class="progress-item">
                        <div class="progress-label">NOI/NOI+/CTSC</div>
                        <div class="progress-bar">
                            <div class="progress-fill grey" style="width: 0%"></div>
                        </div>
                        <div class="progress-count">0</div>
                    </div>
                    
                    <div class="progress-item">
                        <div class="progress-label">暂未评级</div>
                        <div class="progress-bar">
                            <div class="progress-fill grey" style="width: 0%"></div>
                        </div>
                        <div class="progress-count">0</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer">
            <div>2025-10-11-11-33-00</div>
            <div>Created by Tabris_ZX</div>
        </div>
    </div>
</body>
</html>
