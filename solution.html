<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>洛谷用户信息页</title>
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .progress-bar {
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
    }
  </style>
</head>
<body class="bg-blue-500 text-white">
  <div class="container mx-auto px-4 py-8">
    <div class="flex justify-end mb-4">
      <img src="https://cdn.luogu.com.cn/upload/image_hosting/7k7k7k7k.png" alt="洛谷logo" class="h-10">
    </div>
    <div class="flex flex-col items-center mb-8">
      <img src="https://cdn.luogu.com.cn/upload/image_hosting/abc123.png" alt="用户头像" class="w-32 h-32 rounded-lg mb-4">
      <h1 class="text-3xl font-bold text-green-400">ZX_Tabris</h1>
      <p class="mt-2">UID: 1510521</p>
      <div class="flex gap-4 mt-4">
        <button class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg flex items-center">
          <i class="fas fa-chart-line mr-2"></i>Ranking: None
        </button>
        <button class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg flex items-center">
          <i class="fas fa-star mr-2"></i>ELO: --
        </button>
      </div>
    </div>
    <div class="grid grid-cols-2 gap-4 mb-6">
      <div class="bg-blue-600 p-4 rounded-lg">
        <div class="flex items-center mb-2">
          <i class="fas fa-check-square mr-2"></i>
          <span>做题数</span>
        </div>
        <p class="text-2xl font-bold">204</p>
      </div>
      <div class="bg-blue-600 p-4 rounded-lg">
        <div class="flex items-center mb-2">
          <i class="fas fa-book mr-2"></i>
          <span>提交题目数</span>
        </div>
        <p class="text-2xl font-bold">33</p>
      </div>
      <div class="bg-blue-600 p-4 rounded-lg">
        <div class="flex items-center mb-2">
          <i class="fas fa-users mr-2"></i>
          <span>关注 / 粉丝</span>
        </div>
        <p class="text-2xl font-bold">2 / 2</p>
      </div>
      <div class="bg-blue-600 p-4 rounded-lg">
        <div class="flex items-center mb-2">
          <i class="fas fa-envelope mr-2"></i>
          <span>邮箱</span>
        </div>
        <p class="text-2xl font-bold">--</p>
      </div>
    </div>
    <div class="bg-blue-600 p-4 rounded-lg mb-6">
      <div class="flex items-center mb-2">
        <i class="fas fa-award mr-2"></i>
        <span>获奖信息</span>
      </div>
      <p>暂无记录</p>
    </div>
    <div class="bg-blue-600 p-4 rounded-lg">
      <div class="flex items-center mb-4">
        <i class="fas fa-chart-bar mr-2"></i>
        <span>提交情况</span>
      </div>
      <div class="space-y-4">
        <div>
          <div class="flex justify-between mb-1">
            <span>入门</span>
            <span>35</span>
          </div>
          <div class="progress-bar bg-blue-700">
            <div class="progress-fill bg-red-500" style="width: 40%"></div>
          </div>
        </div>
        <div>
          <div class="flex justify-between mb-1">
            <span>普及-</span>
            <span>106</span>
          </div>
          <div class="progress-bar bg-blue-700">
            <div class="progress-fill bg-orange-500" style="width: 70%"></div>
          </div>
        </div>
        <div>
          <div class="flex justify-between mb-1">
            <span>普及/提高-</span>
            <span>49</span>
          </div>
          <div class="progress-bar bg-blue-700">
            <div class="progress-fill bg-yellow-500" style="width: 50%"></div>
          </div>
        </div>
        <div>
          <div class="flex justify-between mb-1">
            <span>普及+/提高</span>
            <span>14</span>
          </div>
          <div class="progress-bar bg-blue-700">
            <div class="progress-fill bg-green-500" style="width: 20%"></div>
          </div>
        </div>
        <div>
          <div class="flex justify-between mb-1">
            <span>提高+/省选</span>
            <span>0</span>
          </div>
          <div class="progress-bar bg-blue-700">
            <div class="progress-fill bg-blue-500" style="width: 0%"></div>
          </div>
        </div>
        <div>
          <div class="flex justify-between mb-1">
            <span>省选/NOI-</span>
            <span>0</span>
          </div>
          <div class="progress-bar bg-blue-700">
            <div class="progress-fill bg-blue-500" style="width: 0%"></div>
          </div>
        </div>
        <div>
          <div class="flex justify-between mb-1">
            <span>NOI/NOI+/CTSC</span>
            <span>0</span>
          </div>
          <div class="progress-bar bg-blue-700">
            <div class="progress-fill bg-blue-500" style="width: 0%"></div>
          </div>
        </div>
        <div>
          <div class="flex justify-between mb-1">
            <span>暂未评级</span>
            <span>0</span>
          </div>
          <div class="progress-bar bg-blue-700">
            <div class="progress-fill bg-blue-500" style="width: 0%"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="flex justify-between mt-8 text-sm">
      <span>2025-10-11-11-33-00</span>
      <span>Created by Tabris_ZX</span>
    </div>
  </div>
</body>
</html>
